name: Deploy tesla.bosh.kg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesla-bosh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring
      - run: php -l public/api/stations.php
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload site to Fornex
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USER: ${{ secrets.FTPS_USER }}
          LFTP_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTPS_HOST:?}" "${FTPS_USER:?}" "${LFTP_PASSWORD:?}"
          [[ "$FTPS_HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$FTPS_USER" =~ ^[A-Za-z0-9_.@+-]+$ ]]
          release_dir="$(mktemp -d)"
          cp -R public/. "$release_dir/"
          cp data/spark-snapshot.json "$release_dir/api/"
          lftp -c "
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set net:timeout 20
            set net:max-retries 2
            open --env-password -u $FTPS_USER ftp://$FTPS_HOST
            cd /
            mkdir -p /api
            put $release_dir/api/spark-snapshot.json -o /api/spark-snapshot.json
            put $release_dir/api/stations.php -o /api/stations.php
            put $release_dir/.htaccess -o /.htaccess
            put $release_dir/index.html -o /index.html
            cls -l /index.html /api/stations.php
            bye
          "
      - name: Check the published site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 https://tesla.bosh.kg/ | grep -F 'Зарядные станции Кыргызстана' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 90 https://tesla.bosh.kg/api/stations |
            jq -e '(.stations | length) > 0 and (.meta.spark != null) and (.meta.charge24 != null)' > /dev/null
