name: Deploy tesla.bosh.kg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tesla-bosh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring
      - run: |
          php -l public/api/stations.php
          php -l public/api/account.php
          php -l public/api/station-feedback.php
          php -l public/api/root-access.php
          php -l public/root.php
          php -l public/api/google-start.php
          php -l public/api/google-callback.php
      - name: Install FTPS client
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y lftp
      - name: Upload site to Fornex
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_USER: ${{ secrets.FTPS_USER }}
          LFTP_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
          CARTO_BASEMAP_KEY: ${{ secrets.CARTO_BASEMAP_KEY }}
        run: |
          set -euo pipefail
          : "${FTPS_HOST:?}" "${FTPS_USER:?}" "${LFTP_PASSWORD:?}"
          [[ "$FTPS_HOST" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$FTPS_USER" =~ ^[A-Za-z0-9_.@+-]+$ ]]
          release_dir="$(mktemp -d)"
          cp -R public/. "$release_dir/"
          cp data/spark-snapshot.json "$release_dir/api/"
          # CARTO Voyager uses a client-side, provider-issued public basemap key.
          # If unset, the site safely retains the OSM base map.
          if [[ -n "${CARTO_BASEMAP_KEY:-}" ]]; then
            printf 'window.TESLA_MAP_CONFIG={cartoApiKey:%s};\n' "$(jq -Rn --arg key "$CARTO_BASEMAP_KEY" '$key')" > "$release_dir/map-config.js"
          fi
          lftp -c "
            set cmd:fail-exit yes
            set ftp:ssl-force yes
            set ftp:ssl-protect-data yes
            set ssl:verify-certificate yes
            set net:timeout 20
            set net:max-retries 2
            open --env-password -u $FTPS_USER ftp://$FTPS_HOST
            cd /
            mirror --reverse --verbose $release_dir .
            bye
          "
      - name: Check the published site
        run: |
          set -euo pipefail
          published="$(mktemp)"
          curl --fail --silent --show-error --retry 3 --max-time 20 "https://tesla.bosh.kg/?deploy=$GITHUB_SHA" -o "$published"
          cmp public/index.html "$published"
          for asset in account.html mobile-nav.css; do
            curl --fail --silent --show-error --retry 3 --max-time 20 "https://tesla.bosh.kg/$asset?deploy=$GITHUB_SHA" -o "$published"
            cmp "public/$asset" "$published"
          done
          curl --fail --silent --show-error --retry 2 --max-time 90 https://tesla.bosh.kg/api/stations |
            jq -e '(.stations | length) > 0 and (.meta.spark != null) and (.meta.charge24 != null)' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 90 'https://tesla.bosh.kg/api/stations?view=map' |
            jq -e '(.sites | length) > 0 and (.stations | length) > 0 and ([.stations[] | select(.operator == "SPARK KG")] | length) == 0 and (.meta | keys) == ["charge24", "evion", "spark", "weway"]' > /dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 'https://tesla.bosh.kg/api/account.php?action=vehicle_catalog' |
            jq -e 'any(.makes[]; .name == "Tesla" and any(.models[]; .name == "Model 3")) and any(.makes[]; .name == "BYD" and any(.models[]; .name == "Song Plus DM-i"))' > /dev/null
          snapshot_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' https://tesla.bosh.kg/api/spark-snapshot.json)"
          [[ "$snapshot_status" == 403 || "$snapshot_status" == 404 ]]
