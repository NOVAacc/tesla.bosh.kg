name: Validate map
on:
  pull_request:
  push:
    branches: [feature/weway-public-catalog]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php -l public/api/stations.php
