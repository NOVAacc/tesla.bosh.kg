name: Validate map and EV account APIs
on:
  pull_request:
  push:
    branches: [feature/weway-public-catalog, feature/ev-accounts-foundation]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring
      - run: |
          php -l public/api/stations.php
          php -l public/api/account-bootstrap.php
          php -l public/api/account.php
