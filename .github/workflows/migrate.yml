name: Apply EV database migrations (SSH)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'tools/migrate.php'
      - '.github/workflows/migrate.yml'

permissions:
  contents: read

concurrency:
  group: tesla-bosh-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: Validate migration runner
        run: php -l tools/migrate.php
      - name: Configure SSH with verified host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          SSH_HOST="hostde44.fornex.host"
          SSH_PORT="20022"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh"
          # Pin the ED25519 fingerprint observed from the user's Mac on 2026-11-19.
          # Never trust an arbitrary ssh-keyscan result without comparing this fingerprint.
          ssh-keyscan -T 12 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}')"
          [[ "$actual" == "SHA256:jP178AGu1yc/dG/xpQ6x+Fcrid2O2RYUxGtfBmPDEo8" ]] || { echo "SSH server fingerprint differs; refusing connection"; exit 1; }
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          printf '#!/bin/sh\nprintf "%%s\\n" "$SSH_KEY_PASSPHRASE"\n' > "$RUNNER_TEMP/ssh-askpass"
          chmod 700 "$RUNNER_TEMP/ssh-askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add "$RUNNER_TEMP/deploy_key" </dev/null
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/ssh-askpass"
          ssh-add -l
      - name: Upload migrations outside the public web directory
        run: |
          set -euo pipefail
          tar -czf - -C "$GITHUB_WORKSPACE" database tools/migrate.php |
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 "g143326@$SSH_HOST" \
              'umask 077; mkdir -p /home/g143326/.tesla-migrations && tar -xz -C /home/g143326/.tesla-migrations'
      - name: Apply pending MySQL migrations on Fornex
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=12 "g143326@$SSH_HOST" \
            '/opt/cpanel/ea-php83/root/usr/bin/php /home/g143326/.tesla-migrations/tools/migrate.php'
