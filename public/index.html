function startSparkDetails(site,isVisible,render){
  if(site.operator!=='SPARK KG')return ()=>{};
  const controller=new AbortController();
  let stopped=false,busy=false;
  async function update(){
    if(stopped||!isVisible()||document.hidden||busy)return;
    busy=true;
    let changed=false,error='';
    try{
      for(const device of site.devices||[site]){
        if(stopped||!isVisible())return;
        if(!device.sourceId)continue;
        try{
          const response=await fetch('/api/stations?sparkCard='+encodeURIComponent(device.sourceId),{signal:controller.signal});
          const data=await response.json();
          if(!response.ok){error='Данные SPARK временно недоступны.';continue}
          for(const port of device.connectors||[]){
            const detail=data.connectors?.[port.evseId+':'+port.connectorId];
            if(!detail)continue;
            const raw=detail.percentage,pct=raw===null||raw===undefined?null:Number(raw);
            const next=canon(port.status)==='OCCUPIED'&&!port.chargingFinished&&Number.isFinite(pct)&&pct>=0&&pct<=100?pct:null;
            if(port.percentage!==next){port.percentage=next;changed=true}
            if(JSON.stringify(port.tariff??null)!==JSON.stringify(detail.tariff??null)){port.tariff=detail.tariff;changed=true}
            if(Number(detail.powerKw)>0&&port.powerKw!==detail.powerKw){port.powerKw=detail.powerKw;changed=true}
          }
        }catch{error='Не удалось получить детали SPARK.'}
      }
      if(!stopped&&isVisible()){
        if(site.detailError!==error){site.detailError=error;changed=true}
        if(changed)render();
      }
    }finally{busy=false}
  }
  update();
  const timer=setInterval(update,60000);
  return ()=>{stopped=true;controller.abort();clearInterval(timer)};
}

      if(pct!==null){
        const percent=Math.max(0,Math.min(100,pct));
        html+=`<div class="station-charge"><div class="station-battery"><div class="station-battery-fill" style="height:calc((100% - 6px) * ${percent/100})"></div></div><div class="station-charge-copy"><div class="station-percent">${esc(percent)}%</div><div class="station-charge-label">Текущий заряд автомобиля</div><div class="station-charge-track"><div class="station-charge-progress" style="width:${percent}%"></div></div></div></div>`;

}


let listMode=false,userCoords=null,locationState='idle';
function validCoordinates(s){return Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))&&Math.abs(Number(s.lat))<=90&&Math.abs(Number(s.lng))<=180}
function distanceKm(a,b){
 const toRad=Math.PI/180,lat1=a.lat*toRad,lat2=b.lat*toRad;
 const dlat=(b.lat-a.lat)*toRad,dlon=(b.lng-a.lng)*toRad;
 const hav=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;
 return 6371*2*Math.asin(Math.min(1,Math.sqrt(hav)));
}
function nearbySortedStations(){
 const entries=stations.filter(s=>validCoordinates(s)&&matches(s));
 if(userCoords)entries.sort((a,b)=>distanceKm(userCoords,a)-distanceKm(userCoords,b)||a.name.localeCompare(b.name,'ru'));
 else entries.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
 return entries;
}
function requestLocation(){
 if(!navigator.geolocation){locationState='unsupported';renderStationList();return}
 locationState='loading';renderStationList();
 navigator.geolocation.getCurrentPosition(position=>{
   userCoords={lat:position.coords.latitude,lng:position.coords.longitude};
   locationState='ready';renderStationList();
 },error=>{
   locationState=error.code===1?'denied':'unavailable';
   renderStationList();
 },{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
}
function renderStationList(){
 if(!listMode)return;
 const label=$('nearbyLocation');
 if(locationState==='ready'&&userCoords)label.textContent='От ближайшей к дальней · расстояние по прямой';
 else{
   label.replaceChildren();
   const message=document.createElement('span');
   message.textContent=locationState==='loading'?'Определяем местоположение…':locationState==='denied'?'Доступ к геолокации отклонён. Станции пока по алфавиту.':locationState==='unavailable'||locationState==='unsupported'?'Не удалось определить местоположение. Станции по алфавиту.':'Разрешите геолокацию для сортировки по расстоянию.';
   label.append(message);
   if(locationState!=='loading'&&locationState!=='unsupported'){
     const retry=document.createElement('button');retry.type='button';retry.textContent='Определить';retry.addEventListener('click',requestLocation);label.append(retry);
   }
 }
 const container=$('nearbyContent'),oldScroll=$('stationListView').scrollTop;
 container.replaceChildren();
 const entries=nearbySortedStations();
 if(!entries.length){const empty=document.createElement('p');empty.className='nearby-empty';empty.textContent='По выбранным фильтрам станции не найдены';container.append(empty);return}
 for(const site of entries){
   const ports=flatten(site),free=ports.filter(isFree).length;
   const types=[...new Set(ports.map(x=>type(x.connector)).filter(Boolean))].slice(0,3);
   const card=document.createElement('button');card.type='button';card.className='nearby-card';
   const head=document.createElement('div');head.className='nearby-card-head';
   const title=document.createElement('span');title.className='nearby-card-title';title.textContent=site.name;
   head.append(title);
   if(userCoords){
     const km=distanceKm(userCoords,site),distance=document.createElement('span');
     distance.className='nearby-card-distance';distance.textContent=km<1?Math.round(km*1000)+' м':km.toLocaleString('ru-RU',{maximumFractionDigits:1})+' км';
     head.append(distance);
   }
   const address=document.createElement('div');address.className='nearby-card-address';address.textContent=(site.address||'Адрес не указан')+' · '+site.operator;
   const footer=document.createElement('div');footer.className='nearby-card-foot';
   const freeTag=document.createElement('span');freeTag.className='nearby-pill '+(free?'free':'busy');freeTag.textContent=free?free+' свободно из '+ports.length:ports.length?'Свободных нет':'Нет данных по разъёмам';
   footer.append(freeTag);
   for(const v of types){const tag=document.createElement('span');tag.className='nearby-pill';tag.textContent=v;footer.append(tag)}
   card.append(head,address,footer);
   card.addEventListener('click',()=>{
     if(mobileMQ.matches)openStationPanel(site);
     else{setListMode(false);const markerRef=visibleMarkers.get(site.id);map.setView([site.lat,site.lng],Math.max(map.getZoom(),15));if(markerRef)markerRef.openPopup()}
   });
   container.append(card);
 }
 $('stationListView').scrollTop=oldScroll;
}
function setListMode(enabled){
 listMode=!!enabled;
 $('stationListView').classList.toggle('is-open',listMode);
 $('stationListView').setAttribute('aria-hidden',String(!listMode));
 $('desktopList').setAttribute('aria-pressed',String(listMode));
 $('desktopList').textContent=listMode?'На карте':'Списком';
 if(!listMode)closeStationPanel();
 for(const tab of document.querySelectorAll('[data-mobile-tab]')){
   if(tab.dataset.mobileTab==='list'||tab.dataset.mobileTab==='map')tab.setAttribute('aria-pressed',String(tab.dataset.mobileTab===(listMode?'list':'map')));
 }
 if(listMode){
   renderStationList();
   if(locationState==='idle')requestLocation();
 }else{setTimeout(()=>map.invalidateSize(),60)}
}

const visibleMarkers=new Map();
function draw(){closeStationPanel();layer.clearLayers();visibleMarkers.clear();let shown=0,units=0,ports=0,free=0;for(const s of stations){if(!matches(s))continue;const parts=flatten(s);shown++;units+=(s.devices?s.devices.length:1);ports+=parts.length;free+=parts.filter(isFree).length;const markerRef=L.marker([s.lat,s.lng],{icon:marker(s)}).addTo(layer);if(mobileMQ.matches){markerRef.on('click',()=>openStationPanel(s))}else{markerRef.bindPopup(()=>popup(s),{maxHeight:350,maxWidth:350}).on('popupopen',event=>enrichSparkPopup(event,s))}visibleMarkers.set(s.id,markerRef)}updateSearchResults();renderStationList();$('summary').textContent=`Найдено площадок: ${shown} · устройств: ${units} · коннекторов: ${ports} · доступных: ${free} · всего SPARK: ${meta.spark?.count||0}, Charge24: ${meta.charge24?.count||0}, WeWay: ${meta.weway?.count||0}, EVION: ${meta.evion?.count||0}`}
let refreshing=false;
async function refresh(){if(refreshing)return;refreshing=true;const old=$('status');old.textContent='Обновление данных…';try{const r=await fetch('/api/stations?view=map');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();meta=d.meta||{};stations=[...(d.sites||[]),...(d.stations||[]).filter(x=>x.operator==='Charge24'||x.operator==='WeWay'||x.operator==='EVION')];refreshTypes();draw();old.innerHTML=`<span class="dot" style="background:${meta.spark?.count?'#209769':'#d8a13c'}"></span>SPARK: ${esc(meta.spark?.source||'none')}${meta.spark?.error?' — '+esc(meta.spark.error):''}${meta.spark?.connectorTypesError?' · тип CCS2 не проверен: '+esc(meta.spark.connectorTypesError):''} · <span class="dot" style="background:${meta.charge24?.count?'#209769':'#d8a13c'}"></span>Charge24: ${esc(meta.charge24?.source||'none')}${meta.charge24?.error?' — '+esc(meta.charge24.error):''} · <span class="dot" style="background:${meta.weway?.count?'#209769':'#d8a13c'}"></span>WeWay: ${esc(meta.weway?.source||'none')}${meta.weway?.error?' — '+esc(meta.weway.error):''} · <span class="dot" style="background:${meta.evion?.count?'#209769':'#d8a13c'}"></span>EVION: ${esc(meta.evion?.source||'none')}${meta.evion?.error?' — '+esc(meta.evion.error):''} <span class="refresh-note">· Кэш 5 мин</span>`;if(first&&stations.length){const bounds=L.latLngBounds(stations.map(s=>[s.lat,s.lng]));if(bounds.isValid())map.fitBounds(bounds,{padding:[24,24]});first=false}}catch(e){old.textContent='Ошибка загрузки: '+e.message}finally{refreshing=false}}
for(const id of ['spark','charge24','weway','evion'])$(id).onclick=()=>{filter[id]=!filter[id];$(id).setAttribute('aria-pressed',String(filter[id]));refreshTypes();draw()};for(const id of ['search','availability','current','power','station','portstatus','extras'])$(id).addEventListener(id==='search'?'input':'change',draw);$('refresh').onclick=refresh;$('reset').onclick=()=>{filter.spark=filter.charge24=filter.weway=filter.evion=true;selectedConnectorTypes.clear();for(const id of ['spark','charge24','weway','evion'])$(id).setAttribute('aria-pressed','true');$('search').value='';for(const id of ['availability','current','power','station','portstatus','extras'])$(id).value='all';refreshTypes();draw()};
$('connectorPickerButton').onclick=()=>{const picker=$('connectorPicker'),open=!picker.classList.contains('is-open');picker.classList.toggle('is-open',open);$('connectorPickerButton').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',event=>{if(!$('connectorPicker').contains(event.target)){$('connectorPicker').classList.remove('is-open');$('connectorPickerButton').setAttribute('aria-expanded','false')}});
$('connectorPicker').addEventListener('keydown',event=>{if(event.key==='Escape'){$('connectorPicker').classList.remove('is-open');$('connectorPickerButton').setAttribute('aria-expanded','false');$('connectorPickerButton').focus()}});
const mobileMQ=window.matchMedia('(max-width:850px)');
const filterEl=$('search').closest('.filters');
const desktopFilterParent=filterEl.parentNode;
const desktopFilterNext=filterEl.nextSibling;
const desktopSearchParent=$('search').parentNode;
const desktopSearchNext=$('search').nextSibling;
let activeSheet=null;
function updateSearchResults(){
 const wrap=$('searchResults');if(!wrap)return;
 wrap.replaceChildren();
 const query=$('search').value.trim();
 if(!query){const note=document.createElement('div');note.className='result-title';note.textContent='Введите название станции или адрес';wrap.append(note);return}
 const entries=stations.filter(s=>matches(s)).slice(0,40);
 const label=document.createElement('div');label.className='result-title';label.textContent=entries.length?'Результаты поиска'+(entries.length===40?' (первые 40)':''):'Ничего не найдено';wrap.append(label);
 for(const station of entries){
   const btn=document.createElement('button');btn.type='button';btn.className='search-result';
   const details=document.createElement('span'),name=document.createElement('b'),address=document.createElement('small');
   name.textContent=station.name;address.textContent=station.address||station.operator;details.append(name,address);
   btn.append(details);const arrow=document.createElement('span');arrow.textContent='›';btn.append(arrow);
   btn.onclick=()=>{closeSheet();const mark=visibleMarkers.get(station.id);map.setView([station.lat,station.lng],Math.max(map.getZoom(),15),{animate:true});if(mobileMQ.matches){setListMode(false);openStationPanel(station)}else if(mark)mark.openPopup()};
   wrap.append(btn);
 }
}
function syncDockActions(){
 for(const button of document.querySelectorAll('.mobile-nav [aria-expanded]')){
   button.setAttribute('aria-expanded',String(button.dataset.mobileTab===activeSheet));
 }
}
function closeSheet(){
 activeSheet=null;
 for(const id of ['searchSheet','filterSheet']){const sheet=$(id);sheet.classList.remove('is-open');sheet.setAttribute('aria-hidden','true')}
 $('mobileShade').setAttribute('aria-hidden','true');
 syncDockActions();
 setTimeout(()=>map.invalidateSize(),50);
}
function openSheet(name){
 if(!mobileMQ.matches)return;
 closeStationPanel();
 if(name==='map'){closeSheet();setListMode(false);closeStationPanel();return}
 if(name==='list'){closeSheet();closeStationPanel();setListMode(true);return}
 activeSheet=name;
 for(const id of ['searchSheet','filterSheet']){const sheet=$(id);const selected=id===(name==='search'?'searchSheet':'filterSheet');sheet.classList.toggle('is-open',selected);sheet.setAttribute('aria-hidden',String(!selected))}
 $('mobileShade').setAttribute('aria-hidden','false');
 syncDockActions();
 if(name==='search'){updateSearchResults();setTimeout(()=>$('search').focus({preventScroll:true}),180)}
}
function syncMobileLayout(){
 closeStationPanel();
 if(mobileMQ.matches){
   $('mobileSearchSlot').append($('search'));
   $('mobileFilterSlot').append(filterEl);
 }else{
   closeSheet();
   desktopFilterParent.insertBefore(filterEl,desktopFilterNext);
   desktopSearchParent.insertBefore($('search'),desktopSearchNext);
 }
 map.invalidateSize();
 if(stations.length)draw();
 if(listMode)renderStationList();
}
$('closeStation').addEventListener('click',closeStationPanel);
$('desktopList').addEventListener('click',()=>{closeStationPanel();setListMode(!listMode)});
for(const tab of document.querySelectorAll('[data-mobile-tab]'))tab.addEventListener('click',()=>openSheet(tab.dataset.mobileTab));
for(const btn of document.querySelectorAll('[data-close-sheet]'))btn.addEventListener('click',closeSheet);
$('mobileShade').addEventListener('click',closeSheet);
$('applyFilters').addEventListener('click',closeSheet);
$('mobileReset').addEventListener('click',()=>$('reset').click());
$('mobileRefresh').addEventListener('click',()=>refresh());
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(activeSheet)closeSheet();else closeStationPanel()}});
map.on('click',()=>{if(mobileMQ.matches&&selectedStation)closeStationPanel()});
mobileMQ.addEventListener('change',syncMobileLayout);
syncMobileLayout();
refresh();
</script></body></html>
